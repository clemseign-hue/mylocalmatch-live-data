name: Mise à jour quotidienne des données MyLocalMatch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install playwright@^1.48.0

      - name: Installer le navigateur headless
        run: npx playwright install --with-deps chromium

      - name: Lancer le robot d'extraction
        run: node scrape-laura.js

      - name: Publier les données mises à jour
        run: |
          git config user.name "MyLocalMatch Bot"
          git config user.email "actions@github.com"
          git add events-amateur.json debug-*.txt 2>/dev/null || git add events-amateur.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push
