name: Vérification handball (ponctuel, sans crédit)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node discover-handball.js
      - name: Publier le résultat
        run: |
          git config user.name "MyLocalMatch Bot"
          git config user.email "actions@github.com"
          git add debug-handball.json
          git diff --quiet --cached || git commit -m "Vérification handball ($(date -u +%Y-%m-%d))"
          git push
