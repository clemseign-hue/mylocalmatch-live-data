name: Mise à jour quotidienne des données MyLocalMatch

on:
  schedule:
    # Tous les jours à 6h00 UTC (8h00 heure de Paris en été)
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # permet aussi de lancer le robot manuellement depuis l'onglet "Actions" de GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: scraper
        run: npm install

      - name: Installer le navigateur headless
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Lancer le robot d'extraction
        working-directory: scraper
        run: node scrape-laura.js

      - name: Publier les données mises à jour
        run: |
          git config user.name "MyLocalMatch Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push
